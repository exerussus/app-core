<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчёт аналитики</title>
<style>
:root{
  color-scheme:dark;
  --bg:#070C11;--panel:#0D151C;--inset:#0A1117;--line:#1D2B36;--line2:#15212A;
  --text:#D3E4EC;--dim:#A9BDC8;--faint:#8FA5B2;--mute:#6F8794;
  --accent:#5CC8DC;--warnText:#F0BA65;
  --good:#0ca30c;--bad:#d03b3b;--gray:#4A5C68;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9;--s7:#008300;--s8:#e66767;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{color:#8EDDEB;text-decoration:underline}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:24px 28px 56px;display:flex;flex-direction:column;gap:18px}
.mono{font-family:var(--mono)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.cap{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0}
h1{margin:0;font-size:24px;font-weight:600}h2{margin:0;font-size:16px;font-weight:600}h3{margin:0;font-size:14px;font-weight:600}
.muted{color:var(--faint)}.dim{color:var(--dim)}.small{font-size:12px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px}
nav.tabs a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:8px;color:var(--dim)}
nav.tabs a:hover{background:#111C25;color:var(--text);text-decoration:none}
nav.tabs a.on{background:#10303A;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border:1px solid var(--line);border-radius:13px;font-size:12px;color:var(--dim);background:var(--inset);white-space:nowrap}
.chip.ok{border-color:#1F5A2A;color:#8FD49A}.chip.bad{border-color:#6A2626;color:#F19A9A}.chip.warn{border-color:#5A4318;color:var(--warnText)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.views{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
.kpi{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;color:#EAF4F8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .h{font-size:12px;color:var(--faint)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .v{font-family:var(--mono);font-size:30px;font-weight:600;color:#EAF4F8}
.hero .l{font-size:12px;color:var(--faint)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.grow{flex:999 1 620px;min-width:0}.side{flex:1 1 360px;min-width:0}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--faint);text-align:left;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
td{padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
td.num,th.num{text-align:right;font-family:var(--mono)}
tr.click{cursor:pointer}tr.click:hover td{background:#0F1C24}
tr.low td{color:var(--mute)}
td .cellbar{display:inline-block;height:6px;border-radius:3px;background:var(--s1);vertical-align:middle;margin-left:8px;opacity:.85}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;display:flex;gap:2px}
.bar>span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbars .r{display:grid;grid-template-columns:minmax(90px,200px) 1fr 90px;gap:10px;align-items:center;font-size:13px}
.hbars .r .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars .r .tr{height:10px;background:var(--line2);border-radius:5px;overflow:hidden}
.hbars .r .tr span{display:block;height:100%;border-radius:5px}
.hbars .r .vl{text-align:right;font-family:var(--mono);color:var(--dim)}
.hbars .r.low{opacity:.55}
svg{display:block;overflow:visible}
svg text{fill:var(--faint);font:11px var(--mono)}
.funnel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(96px,170px);gap:10px;overflow-x:auto;padding-bottom:4px}
.funnel .st{display:flex;flex-direction:column;gap:6px;font-size:12px}
.funnel .tube{height:130px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--inset);border-radius:6px;overflow:hidden;position:relative}
.funnel .tube span{display:block;background:#1c5cab;border-top:2px solid var(--s1)}
.funnel .tube span.done{position:absolute;left:0;right:0;bottom:0;background:var(--s1);border:0;opacity:.6}
.heat{display:grid;gap:2px;font:11px var(--mono);overflow-x:auto}
.heat div{min-height:26px;display:flex;align-items:center;justify-content:center;border-radius:3px;padding:0 4px;white-space:nowrap}
.heat .lab{justify-content:flex-start;color:var(--faint);background:none;overflow:hidden;text-overflow:ellipsis}
.heat .colh{justify-content:center;color:var(--faint);writing-mode:vertical-rl;transform:rotate(180deg);min-height:70px;align-items:flex-end}
.tl{min-width:900px;display:flex;flex-direction:column;gap:5px}
.tl .lane{display:grid;grid-template-columns:200px 1fr;align-items:center}
.tl .name{font:12px var(--mono);color:var(--dim);padding-right:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .track{position:relative;height:28px;background:var(--inset);border-radius:4px}
.tl .axis{position:relative;height:20px;border-bottom:1px solid var(--line)}
.tl .axis span{position:absolute;bottom:3px;transform:translateX(-50%);font:11px var(--mono);color:var(--faint)}
.tl .span{position:absolute;top:5px;bottom:5px;border-radius:3px;min-width:2px}
.tl .span.open{opacity:.55}
.tl .mark{position:absolute;top:4px;bottom:4px;width:3px;margin-left:-1px;border-radius:1px}
input.search,select.sel{min-height:36px;background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:0 12px}
input.search{width:100%;max-width:320px}
.empty{padding:28px;text-align:center;color:var(--faint)}
.warn{color:var(--warnText)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:8px;border:1px solid #2A4452;background:#0F1B23;cursor:pointer}
.btn:hover{background:#13232D}.btn.on{background:#10303A;border-color:var(--accent)}
.foot{font-size:12px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line2);padding-top:10px}
.tip{position:fixed;z-index:10;pointer-events:none;background:#0F1B23;border:1px solid #2A4452;border-radius:6px;padding:6px 9px;font:12px var(--mono);color:var(--text);white-space:pre;display:none;max-width:420px}
.box{display:flex;flex-direction:column;gap:6px}
.code{font:12px var(--mono);color:var(--dim);background:var(--inset);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
@media (max-width:720px){.wrap{padding:16px}.views{grid-template-columns:1fr}.tl .lane{grid-template-columns:110px 1fr}.hbars .r{grid-template-columns:90px 1fr 70px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Загрузка отчёта…</div></div>
<div class="tip" id="tip"></div>
<script>

          return { cells: [{ text: e.key, node: el("span", { class: e.system ? "mono muted" : "mono", text: e.key }) }, e.title || "—",
            (e.fields || []).map(function (f) { return f.name + ":" + f.type; }).join(", ") || "—",
            { text: where, node: where ? el("span", { text: where }) : el("span", { class: e.raw ? "muted" : (e.system ? "muted" : "warn"), text: e.raw ? "только сырые данные" : (e.system ? "системное" : "не классифицировано") }) },
            e.count] };
        }), { limit: 1000 }));
    }
    q.addEventListener("input", draw);
    draw();
    var profileRows = (cat.profiles || []).map(function (p) { return { cells: [{ text: p.id, node: el("span", { class: "mono", text: p.id }) }, p.title || "—", (p.views || []).join(", ") || "все", (p.formats || []).join(", ") || "—", p.lastDays ? "последние " + p.lastDays + " дн." : ((p.from || "…") + " – " + (p.to || "…"))] }; });
    frame("catalog", [card("События", el("div", { class: "muted small", text: "каждое событие каталога либо входит в представления, либо помечено «только сырые данные»" }), q, holder),
      profileRows.length ? card("Профили экспорта", table([{ title: "Id" }, { title: "Название" }, { title: "Представления" }, { title: "Форматы" }, { title: "Период" }], profileRows)) : null]);
  }
  function dataPage() {
    var dl = el("button", { class: "btn", text: "Скачать catalog.json", onclick: function () {
      var blob = new Blob([JSON.stringify({ meta: meta, catalog: cat }, null, 2)], { type: "application/json" });
      var a = el("a", { href: URL.createObjectURL(blob), download: "catalog.json" }); document.body.appendChild(a); a.click(); a.remove();
    } });
    var dropped = 0, missing = 0; sessions.forEach(function (s) { dropped += s.dropped || 0; missing += s.missing || 0; });
    frame("data", [
      kpis([["Файлов", num(meta.files, 0), ""], ["Пакетов", num(meta.packets, 0), "дублей " + num(meta.duplicates, 0)], ["Битых строк", num(meta.broken, 0), "оборванные файлы"],
        ["Пропущено событий", num(missing, 0), "из них сообщено о потере " + num(dropped, 0)], ["Часовой пояс", meta.timezone || "UTC", "для дней и когорт"]]),
      card("Источники", el("div", { class: "box" }, (meta.sources || []).map(function (s) { return el("div", { class: "mono small", text: s }); }))),
      card("Билды и платформы", el("div", { class: "chips" }, (meta.builds || []).map(function (b) { return el("span", { class: "chip", text: b }); }).concat((meta.platforms || []).map(function (p) { return el("span", { class: "chip", text: p }); })))),
      card("Каталог", el("div", { class: "muted small", text: "события, классификация и представления — чтобы разобрать выгрузку без проекта" }), el("div", { class: "btnrow" }, dl)),
      (meta.warnings || []).length ? card("Предупреждения", el("div", { class: "box" }, meta.warnings.map(function (w) { return el("div", { class: "warn small", text: w }); }))) : null
    ]);
  }

  function route() {
    var h = location.hash.replace(/^#/, "");
    var slash = h.indexOf("/"), page = slash >= 0 ? h.slice(0, slash) : h, arg = slash >= 0 ? safeDecode(h.slice(slash + 1)) : null;
    try {
      switch (page) {
        case "views": return viewsPage();
        case "view": return viewPage(arg);
        case "tags": return tagsPage();
        case "tag": return tagPage(arg);
        case "runs": return runsPage();
        case "run": return runPage(parseInt(arg, 10));
        case "players": return playersPage();
        case "player": return playerPage(arg);
        case "catalog": return catalogPage();
        case "data": return dataPage();
        default: return overview();
      }
    } catch (e) {
      app.innerHTML = "";
      add(app, el("div", { class: "card warn", text: "Ошибка отрисовки: " + e.message }));
      if (window.console) console.error(e);
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>

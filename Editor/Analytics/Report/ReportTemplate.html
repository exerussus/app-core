<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчёт аналитики</title>
<style>
:root{
  --bg:#070C11;--panel:#0D151C;--inset:#0A1117;--line:#1D2B36;--line2:#15212A;
  --text:#D3E4EC;--dim:#A9BDC8;--faint:#8FA5B2;--mute:#6F8794;
  --accent:#5CC8DC;--fill:#2BA3BA;--warn:#E8A33D;--warnText:#F0BA65;--gray:#3A4B57;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{color:#8EDDEB;text-decoration:underline}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:24px 28px 56px;display:flex;flex-direction:column;gap:18px}
.mono{font-family:var(--mono)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.cap{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0}
h1{margin:0;font-size:24px;font-weight:600}h2{margin:0;font-size:16px;font-weight:600}h3{margin:0;font-size:14px;font-weight:600}
.muted{color:var(--faint)}.dim{color:var(--dim)}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px}
nav.tabs a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:8px;color:var(--dim)}
nav.tabs a:hover{background:#111C25;color:var(--text);text-decoration:none}
nav.tabs a.on{background:#10303A;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--dim);background:var(--inset)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;color:#EAF4F8}
.kpi .h{font-size:12px;color:var(--faint)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.grow{flex:999 1 620px;min-width:0}.side{flex:1 1 360px;min-width:0}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--faint);text-align:left;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono)}
tr.click{cursor:pointer}tr.click:hover td{background:#0F1C24}
tr.sel td{background:#0F2730}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;display:flex}
.bar>span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cols{display:flex;align-items:flex-end;gap:10px;height:200px;border-bottom:1px solid var(--line);padding:0 4px}
.cols .c{flex:1 1 0;display:flex;flex-direction:column-reverse;gap:2px;height:100%;min-width:6px}
.cols .c span{display:block;border-radius:2px}
.xlabels{display:flex;gap:10px;padding:0 4px}.xlabels span{flex:1 1 0;text-align:center;font:11px var(--mono);color:var(--faint);overflow:hidden;white-space:nowrap}
.funnel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(110px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.funnel .st{display:flex;flex-direction:column;gap:6px}
.funnel .tube{height:140px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--inset);border-radius:6px;overflow:hidden}
.funnel .tube span{display:block;background:#1E6F80;border-top:2px solid var(--accent)}
.funnel .tube span.done{background:#2BA3BA}
.tl{min-width:900px;display:flex;flex-direction:column;gap:5px}
.tl .lane{display:grid;grid-template-columns:190px 1fr;align-items:center}
.tl .name{font:12px var(--mono);color:var(--dim);padding-right:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .track{position:relative;height:28px;background:var(--inset);border-radius:4px}
.tl .axis{position:relative;height:20px;border-bottom:1px solid var(--line)}
.tl .axis span{position:absolute;bottom:3px;transform:translateX(-50%);font:11px var(--mono);color:var(--faint)}
.tl .span{position:absolute;top:6px;bottom:6px;border-radius:3px}
.tl .span.k0{top:3px;bottom:3px;background:#15333C;border:1px solid var(--fill)}
.tl .span.k1{background:var(--fill)}
.tl .span.k2{background:#6E9DAA}
.tl .span.k3{background:#9A8BD6}
.tl .span.open{border-style:dashed}
.tl .span.band{background:var(--gray)}
.tl .span.away{background:#6B4A1C}
.tl .mark{position:absolute;top:4px;bottom:4px;width:2px;background:var(--text)}
.tl .mark.pos{background:#D3E4EC}.tl .mark.neg{width:3px;background:var(--warn)}.tl .mark.neu{background:#7F94A1}
.log{display:flex;flex-direction:column;font:12px var(--mono)}
.log .r{display:grid;grid-template-columns:56px 76px 76px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid #111B23}
.log .r.head{color:var(--faint);font-size:11px;border-bottom-color:var(--line)}
.log .r span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-sys{color:var(--faint)}.k-role{color:var(--accent)}.k-neg{color:var(--warnText)}.k-none{color:var(--text)}
input.search{min-height:38px;background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:0 12px;width:100%;max-width:320px}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--dim);min-height:28px}
.empty{padding:28px;text-align:center;color:var(--faint)}
.warn{color:var(--warnText)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid #2A4452;background:#0F1B23;cursor:pointer}
.btn:hover{background:#13232D}
.dots{display:inline-flex;gap:2px}.dots i{display:inline-block;width:8px;height:8px;border-radius:2px}
@media (max-width:720px){.wrap{padding:16px}.tl .lane{grid-template-columns:120px 1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Загрузка отчёта…</div></div>
<script>
"use strict";
var D = /*__REPORT_DATA__*/null;

(function () {
  var app = document.getElementById("app");
  if (!D) { app.textContent = "Нет данных отчёта."; return; }

  // ------------------------------------------------------------ утилиты
  function el(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "style") e.setAttribute("style", v);
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
    return e;
  }
  function add(e, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(e, x); }); return; }
    e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  }
  function num(v, d) {
    if (v == null || isNaN(v)) return "—";
    return Number(v).toLocaleString("ru-RU", { maximumFractionDigits: d == null ? 1 : d });
  }
  function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }
  function dur(sec) {
    if (sec == null || isNaN(sec)) return "—";
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    var mm = (m < 10 && h ? "0" : "") + m, ss = (s < 10 ? "0" : "") + s;
    return h ? h + ":" + (m < 10 ? "0" : "") + m + ":" + ss : mm + ":" + ss;
  }
  function median(a) { return quant(a, 0.5); }
  function quant(a, p) {
    a = a.filter(function (x) { return x != null && !isNaN(x); }).sort(function (x, y) { return x - y; });
    if (!a.length) return NaN;
    var pos = (a.length - 1) * p, lo = Math.floor(pos), hi = Math.ceil(pos);
    return lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (pos - lo);
  }
  function date(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function day(iso) { return iso ? iso.slice(0, 10) : "—"; }
  function short(id, n) { return id && id.length > n ? id.slice(0, n) + "…" : (id || "—"); }

  // ------------------------------------------------------------ данные
  var catalog = {}; (D.catalog || []).forEach(function (c) { catalog[c.key] = c; });
  var runs = D.runs || [], sessions = D.sessions || [], profiles = D.profiles || [], tags = D.tags || [];
  var eventsByRun = {}, eventsBySession = {};
  (D.events || []).forEach(function (e) {
    var ev = { session: e[0], run: e[1], s: e[2], t: e[3], g: e[4], key: D.keys[e[5]], f: e[6] || {} };
    (eventsBySession[ev.session] = eventsBySession[ev.session] || []).push(ev);
    if (ev.run >= 0) (eventsByRun[ev.run] = eventsByRun[ev.run] || []).push(ev);
  });
  var intervalsByRun = {};
  (D.intervals || []).forEach(function (i) {
    if (i[1] < 0) return;
    (intervalsByRun[i[1]] = intervalsByRun[i[1]] || []).push({ name: i[2], subject: i[3], start: i[4], end: i[5], closed: i[6] });
  });

  // итоги прогонов: цвета по частоте; системные «unfinished» и прерывания — серые
  var resultCount = {};
  runs.forEach(function (r) { resultCount[r.result] = (resultCount[r.result] || 0) + 1; });
  var grayResults = { unfinished: 1, aborted: 1, destroyed: 1, restarted: 1, interrupted: 1, load_failed: 1, "—": 1 };
  var palette = ["#2BA3BA", "#E8A33D", "#9A8BD6", "#6E9DAA", "#C9785A", "#7FB069"];
  var results = Object.keys(resultCount).sort(function (a, b) {
    var ga = grayResults[a] ? 1 : 0, gb = grayResults[b] ? 1 : 0;
    return ga - gb || resultCount[b] - resultCount[a];
  });
  var resultColor = {}; var pi = 0;
  results.forEach(function (r) { resultColor[r] = grayResults[r] ? (r === "unfinished" ? "#2A3843" : "#3A4B57") : palette[pi++ % palette.length]; });
  var resultName = { unfinished: "не завершён", aborted: "прерван", destroyed: "уничтожен", restarted: "перезапуск", interrupted: "прерван (новый прогон)", load_failed: "ошибка загрузки" };
  function rname(r) { return resultName[r] || r; }
  // цвет текста итога: серые итоги — читаемым приглушённым, а не цветом полосы
  function rtext(r) { return grayResults[r] ? "#8FA5B2" : resultColor[r]; }
  function resultBar(counts, total, width) {
    var b = el("div", { class: "bar", style: "width:" + (width || 120) + "px" });
    results.forEach(function (r) { if (counts[r]) b.appendChild(el("span", { style: "width:" + (counts[r] / total * 100) + "%;background:" + resultColor[r], title: rname(r) + ": " + counts[r] })); });
    return b;
  }
  function legend(list) {
    return el("div", { class: "legend" }, list.map(function (r) { return el("span", null, el("i", { style: "background:" + resultColor[r] }), rname(r)); }));
  }
  function keyClass(key) {
    if (key.indexOf("app.") === 0) return "k-sys";
    var c = catalog[key];
    if (!c || c.role === "none") return "k-none";
    return c.tone === "negative" ? "k-neg" : "k-role";
  }

  // ------------------------------------------------------------ каркас
  var pages = [["overview", "Обзор"], ["tags", "Теги"], ["runs", "Прогоны"], ["players", "Игроки"], ["events", "События"], ["data", "Данные"]];
  function frame(active, body) {
    app.textContent = "";
    var title = D.meta.title || "Аналитика";
    add(app, el("header", { class: "top" },
      el("div", { style: "display:flex;align-items:center;gap:12px;flex-wrap:wrap" },
        el("span", { class: "brand", text: title.toUpperCase() }),
        el("span", { class: "chip mono", text: D.meta.filter || "все данные" })),
      el("nav", { class: "tabs", "aria-label": "Разделы" }, pages.map(function (p) {
        return el("a", { href: "#" + p[0], class: active === p[0] ? "on" : null, text: p[1] });
      }))));
    add(app, body);
    window.scrollTo(0, 0);
  }
  function card(title, extra) {
    var c = el("section", { class: "card", style: "display:flex;flex-direction:column;gap:14px" });
    if (title) add(c, el("div", { style: "display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap" }, el("h2", { text: title }), extra));
    for (var i = 2; i < arguments.length; i++) add(c, arguments[i]);
    return c;
  }
  function kpis(list) {
    return el("section", { class: "grid kpis" }, list.map(function (k) {
      return el("div", { class: "card kpi" }, el("p", { class: "cap", text: k[0] }), el("div", { class: "v", text: k[1] }), el("div", { class: "h", text: k[2] || "" }));
    }));
  }

  // таблица с сортировкой по клику на заголовок
  function table(columns, rows, opts) {
    opts = opts || {};
    var state = { col: opts.sort == null ? -1 : opts.sort, dir: opts.dir || -1 };
    var box = el("div", { class: "tablebox" });
    function draw() {
      var sorted = rows.slice();
      if (state.col >= 0) sorted.sort(function (a, b) {
        var x = a.cells[state.col], y = b.cells[state.col];
        var xs = x && x.sort != null ? x.sort : x, ys = y && y.sort != null ? y.sort : y;
        if (typeof xs === "number" || typeof ys === "number") return ((xs == null || isNaN(xs) ? -Infinity : xs) - (ys == null || isNaN(ys) ? -Infinity : ys)) * state.dir;
        return String(xs == null ? "" : xs).localeCompare(String(ys == null ? "" : ys), "ru") * state.dir;
      });
      var t = el("table", null,
        el("thead", null, el("tr", null, columns.map(function (c, i) {
          return el("th", { scope: "col", class: c.num ? "num" : null, onclick: function () { state.dir = state.col === i ? -state.dir : (c.num ? -1 : 1); state.col = i; draw(); },
            text: c.title + (state.col === i ? (state.dir > 0 ? " ↑" : " ↓") : "") });
        }))),
        el("tbody", null, sorted.map(function (r) {
          return el("tr", { class: (r.onclick ? "click " : "") + (r.selected ? "sel" : ""), onclick: r.onclick }, r.cells.map(function (v, i) {
            var shown = v && v.node ? v.node : (v && v.text != null ? v.text : (typeof v === "number" ? num(v, columns[i].digits) : v));
            return el("td", { class: columns[i].num ? "num" : null }, shown == null ? "—" : shown);
          }));
        })));
      box.textContent = "";
      box.appendChild(t);
    }
    draw();
    return box;
  }

  // ------------------------------------------------------------ Обзор
  function overview() {
    var finished = runs.filter(function (r) { return r.finished; });
    var main = results.filter(function (r) { return !grayResults[r]; });
    var first = main[0];
    var awayRun = 0, timeRun = 0;
    runs.forEach(function (r) { awayRun += r.away || 0; timeRun += r.duration || 0; });

    var top = [
      ["Игроков", num(profiles.length, 0), "профилей"],
      ["Сессий", num(sessions.length, 0), profiles.length ? num(sessions.length / profiles.length) + " на игрока" : ""],
      ["Прогонов", num(runs.length, 0), profiles.length ? num(runs.length / profiles.length) + " на игрока" : ""],
      [first ? rname(first) : "Итог", first ? pct(resultCount[first], runs.length) + "%" : "—", main.slice(1, 3).map(function (r) { return rname(r) + " " + pct(resultCount[r], runs.length) + "%"; }).join(", ")],
      ["Медиана прогона", dur(median(finished.map(function (r) { return r.duration; }))), "реальное время"],
      ["Игровое время", dur(median(runs.map(function (r) { return r.game; }))), "медиана"],
      ["Вне фокуса", timeRun ? pct(awayRun, timeRun) + "%" : "—", "времени прогонов"]
    ];

    // прогоны по дням
    var byDay = {};
    runs.forEach(function (r) { var d = day(r.start); (byDay[d] = byDay[d] || {})[r.result] = (byDay[d][r.result] || 0) + 1; });
    var days = Object.keys(byDay).sort().slice(-31);
    var max = 1;
    days.forEach(function (d) { var s = 0; for (var k in byDay[d]) s += byDay[d][k]; max = Math.max(max, s); });
    var cols = el("div", { class: "cols", role: "img", "aria-label": "Прогоны по дням" }, days.map(function (d) {
      return el("div", { class: "c", title: d }, results.map(function (r) {
        var n = byDay[d][r] || 0;
        return n ? el("span", { style: "height:" + (n / max * 190) + "px;background:" + resultColor[r], title: d + " · " + rname(r) + ": " + n }) : null;
      }));
    }));
    var labels = el("div", { class: "xlabels" }, days.map(function (d) { return el("span", { text: d.slice(5).split("-").reverse().join(".") }); }));

    return [
      kpis(top),
      el("div", { class: "row" },
        (function () { var c = card("Прогоны по дням", legend(results), days.length ? [cols, labels] : el("div", { class: "empty", text: "Нет прогонов" })); c.classList.add("grow"); return c; })()),
      card("Теги прогонов", el("span", { class: "muted", text: "тег — то, что передано в BeginRun (сценарий, уровень)" }), tagsTable())
    ];
  }

  function tagsTable() {
    var rows = tags.map(function (t) {
      var list = t.runs.map(function (i) { return runs[i]; });
      var neg = 0, away = 0, time = 0;
      list.forEach(function (r) { neg += r.negative; away += r.away || 0; time += r.duration || 0; });
      var main = results.filter(function (r) { return !grayResults[r]; })[0];
      return {
        onclick: function () { location.hash = "#tag/" + encodeURIComponent(t.tag); },
        cells: [
          { text: t.tag, node: el("a", { class: "mono", href: "#tag/" + encodeURIComponent(t.tag), text: t.tag }), sort: t.tag },
          list.length,
          { node: el("div", { style: "display:flex;align-items:center;gap:8px" }, resultBar(t.results, list.length), main ? pct(t.results[main] || 0, list.length) + "%" : ""), sort: main ? (t.results[main] || 0) / list.length : 0 },
          { text: dur(median(list.map(function (r) { return r.duration; }))), sort: median(list.map(function (r) { return r.duration; })) },
          { text: dur(median(list.map(function (r) { return r.game; }))), sort: median(list.map(function (r) { return r.game; })) },
          list.length ? neg / list.length : NaN,
          { text: time ? pct(away, time) + "%" : "—", sort: time ? away / time : 0 }
        ]
      };
    });
    if (!rows.length) return el("div", { class: "empty", text: "Нет прогонов" });
    return table([{ title: "Тег" }, { title: "Прогонов", num: true, digits: 0 }, { title: "Итоги" }, { title: "Медиана", num: true }, { title: "Игровое", num: true }, { title: "Неудач / прогон", num: true }, { title: "Вне фокуса", num: true }], rows, { sort: 1 });
  }

  // ------------------------------------------------------------ Тег
  function tagsPage() { return [card("Теги прогонов", null, tagsTable())]; }

  function tagPage(name) {
    var t = tags.filter(function (x) { return x.tag === name; })[0];
    if (!t) return el("div", { class: "empty", text: "Нет тега " + name });
    var list = t.runs.map(function (i) { return runs[i]; });
    var finished = list.filter(function (r) { return r.finished; });
    var neg = 0; list.forEach(function (r) { neg += r.negative; });
    var playersSet = {}; list.forEach(function (r) { playersSet[r.profile] = 1; });
    var main = results.filter(function (r) { return !grayResults[r] && t.results[r]; });

    var head = el("section", { style: "display:flex;flex-direction:column;gap:6px" },
      el("p", { class: "cap", text: "Тег" }), el("h1", { class: "mono", text: t.tag }),
      el("span", { class: "muted", text: list.length + " прогонов · " + Object.keys(playersSet).length + " игроков" }));

    var top = kpis([
      [main[0] ? rname(main[0]) : "Итог", main[0] ? pct(t.results[main[0]], list.length) + "%" : "—", main[0] ? t.results[main[0]] + " из " + list.length : ""],
      ["Медиана прогона", dur(median(finished.map(function (r) { return r.duration; }))), "p90 — " + dur(quant(finished.map(function (r) { return r.duration; }), 0.9))],
      ["Игровое время", dur(median(list.map(function (r) { return r.game; }))), "медиана"],
